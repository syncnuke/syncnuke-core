syntax = "proto3";

package syncplay;
option java_package        = "pl.syncplay.proto";
option java_outer_classname = "SyncplayProto";

/* ---------- top-level envelope ---------- */
message SyncplayMessage {
  oneof body {
    HelloMessage   hello    = 1;
    SetCommand     set      = 2;
    ListMessage    list     = 3;
    StateMessage   state    = 4;
    ErrorMessage   error    = 5;
    ChatMessage    chat     = 6;
    TLSMessage     tls      = 7;
  }
}

/* ---------- common helpers ---------- */
message RoomInfo  { string name = 1; string password = 2; }
message FileInfo  { string name = 1; double duration = 2; int64 size = 3; string path = 4; }

message Features {
  bool feature_list            = 1;
  bool shared_playlists        = 2;
  bool chat                    = 3;
  string ui_mode               = 4;
  bool readiness               = 5;
  bool managed_rooms           = 6;
  bool persistent_rooms        = 7;
  bool set_others_readiness    = 8;
  bool isolate_rooms           = 9;
  int32 max_chat_msg_length    = 10;
  int32 max_username_length    = 11;
  int32 max_room_name_length   = 12;
  int32 max_filename_length    = 13;
}

/* ---------- 1. Hello ---------- */
message HelloMessage {
  string   username    = 1;
  string   password    = 2;          // MD5-hash when sent by client
  RoomInfo room        = 3;
  string   version     = 4;
  string   realversion = 5;
  Features features    = 6;
  string   motd        = 7;          // server → client only
}

/* ---------- 2. Set ---------- */
message SetCommand {
  oneof payload {
    RoomSetting            room              = 1;
    UserSetting            user              = 2;
    FileInfo               file              = 3;
    ControllerAuthRequest  controller_auth   = 4;
    ControllerAuthResult   controller_result = 5;
    ReadySetting           ready             = 6;
    PlaylistIndexSetting   playlist_index    = 7;
    PlaylistChangeSetting  playlist_change   = 8;
    FeaturesUpdate         features          = 9;
    NewControlledRoom      new_controlled_room = 10;
  }
}

message RoomSetting           { RoomInfo room = 1; }
message UserSetting           { string username = 1; RoomInfo room = 2; FileInfo file = 3;
  enum Event { NONE = 0; JOINED = 1; LEFT = 2; }
  Event event = 4; }

message ControllerAuthRequest { string room = 1; string password = 2; }
message ControllerAuthResult  { string user = 1;  string room = 2; bool success = 3; }

message ReadySetting          { string username = 1; bool is_ready = 2;
  bool manually_initiated = 3; string set_by = 4; }

message PlaylistIndexSetting  { string user = 1; int32 index = 2; }
message PlaylistChangeSetting { string user = 1; repeated FileInfo files = 2; }

message FeaturesUpdate        { string username = 1; Features features = 2; }

message NewControlledRoom     { string room_name = 1; string password = 2; }

/* ---------- 3. List ---------- */
message ListMessage { repeated RoomEntry rooms = 1; }

message RoomEntry  {
  string         room_name = 1;
  repeated UserEntry users = 2;
}

message UserEntry  {
  string      username   = 1;
  double      position   = 2;
  FileInfo    file       = 3;
  bool        controller = 4;
  bool        is_ready   = 5;
  Features    features   = 6;
}

/* ---------- 4. State ---------- */
message StateMessage {
  PlayState playstate           = 1;
  Ping      ping                = 2;
  Ignoring  ignoring_on_the_fly = 3;
}

message PlayState {
  double position = 1;
  bool   paused   = 2;
  bool   do_seek  = 3;
  string set_by   = 4;
}

message Ping {
  int64  latency_calculation       = 1;
  int64  client_latency_calculation = 2;
  double client_rtt                = 3;
  double server_rtt                = 4;
}

message Ignoring {
  int32 server = 1;
  int32 client = 2;
}

/* ---------- 5. Chat ---------- */
message ChatMessage {
  string username = 1;   // present server → client
  string message  = 2;
}

/* ---------- 6. Error ---------- */
message ErrorMessage { string message = 1; }

/* ---------- 7. TLS ---------- */
message TLSMessage { string start_tls = 1; }   // "send", "true", "false"
