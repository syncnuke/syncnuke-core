plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'com.google.protobuf' version '0.10.0'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.syncnuke'
version = '0.2.0'
description = 'A library synchronizing video playback over the internet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // SLF4J
    implementation 'org.slf4j:slf4j-api:2.0.18'

    // Protobuf
    implementation 'com.google.protobuf:protobuf-java:4.36.1'
    implementation 'com.google.protobuf:protobuf-java-util:4.36.1'

    implementation 'io.netty:netty-codec-native-quic:4.2.17.Final'
    runtimeOnly 'io.netty:netty-codec-native-quic:4.2.17.Final:linux-x86_64'
    runtimeOnly 'io.netty:netty-codec-native-quic:4.2.17.Final:linux-aarch_64'
    runtimeOnly 'io.netty:netty-codec-native-quic:4.2.17.Final:windows-x86_64'
    runtimeOnly 'io.netty:netty-codec-native-quic:4.2.17.Final:osx-x86_64'
    runtimeOnly 'io.netty:netty-codec-native-quic:4.2.17.Final:osx-aarch_64'

    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
    // JUnit
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Mockito
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

test {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.36.1'
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java { }
            }
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/protobuf'
        }
    }
}

jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.syncnuke.core',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Specification-Title': project.name,
                'Specification-Version': project.version
        )
    }
    from('LICENSE.md') {
        into 'META-INF'
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'SyncNuke Core'
        description = project.description
        url = 'https://github.com/syncnuke/syncnuke-core'

        licenses {
            license {
                name = 'GNU Lesser General Public License v3.0 only'
                url = 'https://www.gnu.org/licenses/lgpl-3.0.html'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'if-shouldrs'
                name = 'SyncNuke maintainers'
                url = 'https://github.com/syncnuke'
            }
        }

        scm {
            connection = 'scm:git:https://github.com/syncnuke/syncnuke-core.git'
            developerConnection = 'scm:git:ssh://git@github.com/syncnuke/syncnuke-core.git'
            url = 'https://github.com/syncnuke/syncnuke-core'
        }
    }
}

