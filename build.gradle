plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'io.github.syncnuke'
version = '1.0-SNAPSHOT'
description = 'A library synchronizing video playback over the internet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceSets {
        test {
            java {
                toolchain {
                    languageVersion = JavaLanguageVersion.of(21)
                }
            }
        }
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // SLF4J
    implementation 'org.slf4j:slf4j-api:2.0.17'

    // Tinylog
    implementation 'org.tinylog:tinylog-impl:2.7.0'
    implementation 'org.tinylog:slf4j-tinylog:2.7.0'

    // Protobuf
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'com.google.protobuf:protobuf-java-util:4.31.1'

    implementation 'io.netty:netty-codec-native-quic:4.2.17.Final'
    runtimeOnly 'io.netty:netty-codec-native-quic:4.2.17.Final:linux-x86_64'
    runtimeOnly 'io.netty:netty-codec-native-quic:4.2.17.Final:windows-x86_64'

    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
    // JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.1'
    // Mockito
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'
}

test {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.31.1'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { }
            }
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/protobuf'
        }
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Specification-Title': project.name,
                'Specification-Version': project.version
        )
    }
}
